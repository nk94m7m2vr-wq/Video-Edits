<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Headline","default":"Thanks for watching"},
    {"id":"cta","type":"string","label":"Call to action","default":"Subscribe for more"},
    {"id":"accent","type":"color","label":"Accent","default":"#7c5cff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      #root { width: 100%; height: 100%; position: relative; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #card {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;
      }
      #headline { color: #f4f4f5; font-size: 96px; font-weight: 700; letter-spacing: -0.03em; }
      #cta {
        color: #0a0a0a; background: var(--accent); font-size: 40px; font-weight: 600;
        padding: 20px 48px; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <!-- Outro card: 5s. Render with: npx hyperframes render -c compositions/outro.html -o ../media/work/outro.mp4 -->
    <div id="root" data-composition-id="outro" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <h1 id="headline"></h1>
        <div id="cta"></div>
      </div>
    </div>
    <script>
      const { headline, cta, accent } = window.__hyperframes.getVariables();
      document.querySelector("#headline").textContent = headline;
      document.querySelector("#cta").textContent = cta;
      document.documentElement.style.setProperty("--accent", accent);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#headline", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 0.2)
        .fromTo("#cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.6)" }, 0.8)
        .to("#cta", { scale: 1.06, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.8)
        .to(["#headline", "#cta"], { opacity: 0, duration: 0.6 }, 4.3);
      window.__timelines["outro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
