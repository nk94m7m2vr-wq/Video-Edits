<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","default":"Your Video Title"},
    {"id":"subtitle","type":"string","label":"Subtitle","default":"Episode 01"},
    {"id":"accent","type":"color","label":"Accent","default":"#7c5cff"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      #root { width: 100%; height: 100%; position: relative; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #card {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      }
      #bar { width: 0; height: 8px; border-radius: 4px; background: var(--accent); }
      #title { color: #f4f4f5; font-size: 112px; font-weight: 700; letter-spacing: -0.04em; }
      #subtitle { color: #a1a1aa; font-size: 44px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <!-- Intro card: 4s. Override text per video:
         npx hyperframes render -o ../media/work/intro.mp4 --variables '{"title":"…","subtitle":"…"}' -->
    <div id="root" data-composition-id="intro" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="bar"></div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <script>
      const { title, subtitle, accent } = window.__hyperframes.getVariables();
      document.querySelector("#title").textContent = title;
      document.querySelector("#subtitle").textContent = subtitle;
      document.documentElement.style.setProperty("--accent", accent);

      const tl = gsap.timeline({ paused: true });
      tl.to("#bar", { width: 240, duration: 0.6, ease: "power3.out" }, 0.1)
        .fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3)
        .fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.6)
        .to(["#bar", "#title", "#subtitle"], { opacity: 0, y: -20, duration: 0.5, ease: "power2.in", stagger: 0.05 }, 3.3);
      window.__timelines["intro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
